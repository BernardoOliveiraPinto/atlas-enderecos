services:
  api:
    build: ./backend
    ports:
      - "8080:8080"
    volumes:
      - atlas-data:/app/data
  web:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://api:8080
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - api
volumes:
  atlas-data:
